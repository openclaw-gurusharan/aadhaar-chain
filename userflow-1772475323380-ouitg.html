<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #f9f9f9;
            border: 1px solid #ddd;
            margin: 5px 0;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #f44336;
            padding: 5px 10px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #da190b;
        }
        .filter-group {
            margin-bottom: 20px;
            text-align: center;
        }
        .filter-btn {
            padding: 8px 16px;
            margin: 0 5px;
            background-color: #2196F3;
            font-size: 14px;
        }
        .filter-btn:hover {
            background-color: #1976D2;
        }
        li.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <h1>Todo List</h1>
    <div class="input-group">
        <input type="text" id="todoInput" placeholder="Enter todo...">
        <button id="addBtn">Add</button>
    </div>
    <div class="filter-group">
        <button class="filter-btn" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <ul id="todoList"></ul>

    <script>
        const input = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        let currentFilter = 'all';

        function addTodo() {
            const text = input.value.trim();
            if (text === '') return;

            const li = document.createElement('li');
            li.textContent = text;
            li.dataset.status = 'active';

            const completeBtn = document.createElement('button');
            completeBtn.textContent = 'Complete';
            completeBtn.className = 'complete-btn';
            completeBtn.onclick = function() {
                li.classList.toggle('completed');
                li.dataset.status = li.classList.contains('completed') ? 'completed' : 'active';
                filterTodos();
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = function() {
                todoList.removeChild(li);
            };

            li.appendChild(completeBtn);
            li.appendChild(deleteBtn);
            todoList.appendChild(li);
            input.value = '';
            filterTodos();
        }

        function filterTodos() {
            const todos = todoList.querySelectorAll('li');
            todos.forEach(todo => {
                if (currentFilter === 'all') {
                    todo.style.display = '';
                } else if (currentFilter === 'active') {
                    todo.style.display = todo.dataset.status === 'active' ? '' : 'none';
                } else if (currentFilter === 'completed') {
                    todo.style.display = todo.dataset.status === 'completed' ? '' : 'none';
                }
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentFilter = this.dataset.filter;
                filterTodos();
            });
        });

        addBtn.addEventListener('click', addTodo);

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });
    </script>
</body>
</html>
