<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px;">
    <h1 style="text-align: center; color: #333;">Todo List</h1>
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="filter-btn" data-filter="all" style="padding: 8px 16px; background-color: #2199E8; color: white; border: none; border-radius: 4px; cursor: pointer;">All</button>
        <button class="filter-btn" data-filter="active" style="padding: 8px 16px; background-color: #ccc; color: #333; border: none; border-radius: 4px; cursor: pointer;">Active</button>
        <button class="filter-btn" data-filter="completed" style="padding: 8px 16px; background-color: #ccc; color: #333; border: none; border-radius: 4px; cursor: pointer;">Completed</button>
    </div>
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="todoInput" placeholder="Enter todo..." style="flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
        <button id="addBtn" style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">Add</button>
    </div>
    <ul id="todoList" style="list-style-type: none; padding: 0;">
    </ul>
    <script>
        const input = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        let currentFilter = 'all';

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentFilter = this.getAttribute('data-filter');
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.style.backgroundColor = '#ccc';
                    b.style.color = '#333';
                });
                this.style.backgroundColor = '#2199E8';
                this.style.color = 'white';
                filterTodos();
            });
        });

        function filterTodos() {
            const items = todoList.querySelectorAll('li');
            items.forEach(li => {
                const isCompleted = li.classList.contains('completed');
                if (currentFilter === 'all') {
                    li.style.display = 'flex';
                } else if (currentFilter === 'active') {
                    li.style.display = isCompleted ? 'none' : 'flex';
                } else if (currentFilter === 'completed') {
                    li.style.display = isCompleted ? 'flex' : 'none';
                }
            });
        }

        addBtn.addEventListener('click', function() {
            const text = input.value.trim();
            if (text) {
                const li = document.createElement('li');
                li.style.padding = '10px';
                li.style.borderBottom = '1px solid #eee';
                li.style.display = 'flex';
                li.style.justifyContent = 'space-between';
                li.style.alignItems = 'center';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.style.marginRight = '10px';
                checkbox.addEventListener('change', function() {
                    li.classList.toggle('completed', this.checked);
                    li.style.textDecoration = this.checked ? 'line-through' : 'none';
                    li.style.color = this.checked ? '#999' : '#000';
                    filterTodos();
                });

                const label = document.createElement('label');
                label.style.flex = '1';
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(text));

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.style.padding = '5px 10px';
                deleteBtn.style.backgroundColor = '#f44336';
                deleteBtn.style.color = 'white';
                deleteBtn.style.border = 'none';
                deleteBtn.style.borderRadius = '4px';
                deleteBtn.style.cursor = 'pointer';

                deleteBtn.addEventListener('click', function() {
                    todoList.removeChild(li);
                });

                li.appendChild(label);
                li.appendChild(deleteBtn);
                todoList.appendChild(li);
                input.value = '';
            }
        });

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addBtn.click();
            }
        });
    </script>
</body>
</html>
